display_information:
  name: T3 Code
features:
  bot_user:
    display_name: T3 Code
    always_online: true
  slash_commands:
    - command: /t3
      description: Start a T3 Code conversation
      usage_hint: "<prompt>"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
